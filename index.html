                { q: "9. การสื่อสารกับทีมสหวิชาชีพต้องยึดหลัก?", opts: ["ความเคารพและการทำงานเป็นทีม", "การสั่งการ", "การตำหนิ", "การแข่งขัน"], ans: 0 },
                { q: "10. ความพร้อมก่อนจบการศึกษาเป็นแพทย์คือ?", opts: ["ความรู้ ทักษะ และทัศนคติที่เหมาะสม", "เรียนจบครบชั่วโมง", "สอบผ่านทุกวิชา", "การมีใบปริญญา"], ans: 0 }
            ]
        }
				
        // *หมายเหตุ: สำหรับปี 2-6 ในระบบจริง โครงสร้างจะใช้ Object แบบเดียวกันนี้ในการดึงข้อสอบอัตโนมัติ
    };

    let currentYearStr = "";
    
    function startExam() {
        const name = document.getElementById('studentName').value;
        const year = document.getElementById('studyYear').value;

        if (!name || !year) {
            alert("กรุณากรอกชื่อและเลือกชั้นปีให้ครบถ้วน");
            return;
        }

        currentYearStr = document.getElementById('studyYear').options[document.getElementById('studyYear').selectedIndex].text;
        
        document.getElementById('loginArea').style.display = 'none';
        document.getElementById('examArea').style.display = 'block';

        renderQuestions(year);
    }

    function renderQuestions(yearKey) {
        const examForm = document.getElementById('examForm');
        examForm.innerHTML = ''; 

        // ตรวจสอบว่ามีข้อมูลปีนี้หรือไม่ (ตัวอย่างนี้มี year1 สมบูรณ์)
        const subjects = examData[yearKey];
        
        if (!subjects) {
            examForm.innerHTML = `<h3 style="color:red; text-align:center;">กำลังปรับปรุงฐานข้อมูลข้อสอบสำหรับชั้นปีนี้... กรุณาทดสอบด้วย "ปี 1 เทอม 1"</h3>`;
            return;
        }

        for (const [subjectName, questions] of Object.entries(subjects)) {
            const subjectDiv = document.createElement('div');
            subjectDiv.className = 'subject-container';
            
            const title = document.createElement('div');
            title.className = 'subject-title';
            title.innerText = `วิชา: ${subjectName}`;
            subjectDiv.appendChild(title);

            questions.forEach((item, index) => {
                const qBlock = document.createElement('div');
                qBlock.className = 'question-block';
                
                const qText = document.createElement('div');
                qText.className = 'question-text';
                qText.innerText = item.q;
                qBlock.appendChild(qText);

                const optionsDiv = document.createElement('div');
                optionsDiv.className = 'options';

                item.opts.forEach((opt, optIndex) => {
                    const label = document.createElement('label');
                    const radio = document.createElement('input');
                    radio.type = 'radio';
                    // บังคับทำทุกข้อ
                    radio.required = true;
                    radio.name = `ans_${subjectName}_${index}`;
                    radio.value = optIndex;

                    label.appendChild(radio);
                    label.appendChild(document.createTextNode(opt));
                    optionsDiv.appendChild(label);
                });

                qBlock.appendChild(optionsDiv);
                subjectDiv.appendChild(qBlock);
            });

            examForm.appendChild(subjectDiv);
        }
    }

    function calculateGrade(score) {
        if (score >= 9) return { letter: 'A', point: 4.0 };
        if (score >= 8) return { letter: 'B+', point: 3.5 };
        if (score >= 7) return { letter: 'B', point: 3.0 };
        if (score >= 6) return { letter: 'C+', point: 2.5 };
        if (score >= 5) return { letter: 'C', point: 2.0 };
        if (score >= 4) return { letter: 'D+', point: 1.5 };
        if (score >= 3) return { letter: 'D', point: 1.0 };
        return { letter: 'F', point: 0.0 };
    }

    function submitExam() {
        const examForm = document.getElementById('examForm');
        if (!examForm.checkValidity()) {
            alert("กรุณาทำข้อสอบให้ครบทุกข้อ (ห้ามขาด) ระบบถึงจะประมวลผลได้");
            return;
        }

        const name = document.getElementById('studentName').value;
        const yearKey = document.getElementById('studyYear').value;
        const subjects = examData[yearKey];

        if (!subjects) return;

        let totalPoints = 0;
        let subjectCount = 0;
        let resultsForDB = {};

        const tbody = document.getElementById('gradeBody');
        tbody.innerHTML = '';

        for (const [subjectName, questions] of Object.entries(subjects)) {
            let score = 0;
            questions.forEach((item, index) => {
                const selected = document.querySelector(`input[name="ans_${subjectName}_${index}"]:checked`);
                if (selected && parseInt(selected.value) === item.ans) {
                    score++;
                }
            });

            const grade = calculateGrade(score);
            totalPoints += grade.point;
            subjectCount++;

            resultsForDB[subjectName] = { score: score, grade: grade.letter };

            const tr = document.createElement('tr');
            tr.innerHTML = `
                <td>${subjectName}</td>
                <td>${score} / 10</td>
                <td><strong>${grade.letter}</strong></td>
            `;
            tbody.appendChild(tr);
        }

        const gpa = (totalPoints / subjectCount).toFixed(2);
        
        document.getElementById('resName').innerText = name;
        document.getElementById('resYear').innerText = currentYearStr;
        document.getElementById('finalGPA').innerText = gpa;

        document.getElementById('examArea').style.display = 'none';
        document.getElementById('resultArea').style.display = 'block';

        // บันทึกลง Firebase Firestore
        db.collection("examResults").add({
            studentName: name,
            academicYear: "2569",
            studyYear: currentYearStr,
            gpa: gpa,
            details: resultsForDB,
            timestamp: firebase.firestore.FieldValue.serverTimestamp()
        }).then(() => {
            console.log("บันทึกข้อมูลนักศึกษาลงฐานข้อมูลสำเร็จ!");
        }).catch((error) => {
            console.error("เกิดข้อผิดพลาดในการบันทึกข้อมูล: ", error);
        });
    }
</script>
