<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ข้อสอบกลางภาค คณะแพทยศาสตร์ มหาวิทยาลัยเบงจันทร์</title>
    <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <div class="logo">มหาวิทยาลัยเบงจันทร์</div>
        <h1>ข้อสอบกลางภาค คณะแพทยศาสตร์</h1>
        <p>ปีการศึกษา 2569</p>
    </header>

    <main class="container">
        <!-- Section 1: User Info -->
        <section id="login-section" class="card active">
            <h2>ข้อมูลนักศึกษา</h2>
            <form id="student-form">
                <div class="form-group">
                    <label for="student-name">ชื่อ-นามสกุล (ไม่ต้องระบุรหัสนักศึกษา)</label>
                    <input type="text" id="student-name" required placeholder="นาย/นางสาว...">
                </div>
                <div class="form-group">
                    <label for="student-year">ชั้นปีที่ศึกษา</label>
                    <select id="student-year" required>
                        <option value="" disabled selected>-- เลือกชั้นปี --</option>
                        <option value="1">ชั้นปีที่ 1</option>
                        <option value="2">ชั้นปีที่ 2</option>
                        <option value="3">ชั้นปีที่ 3</option>
                        <option value="4">ชั้นปีที่ 4</option>
                        <option value="5">ชั้นปีที่ 5</option>
                        <option value="6">ชั้นปีที่ 6 (Externship)</option>
                    </select>
                </div>
                <button type="submit" class="btn btn-primary">เข้าสู่ระบบสอบ</button>
            </form>
        </section>

        <!-- Section 2: Exam -->
        <section id="exam-section" class="card hidden">
            <div id="exam-header">
                <h2>ข้อสอบประเมินความรู้</h2>
                <p id="exam-student-info"></p>
            </div>
            <form id="exam-form">
                <div id="questions-container"></div>
                <button type="submit" class="btn btn-submit">ส่งคำตอบและประมวลผล</button>
            </form>
        </section>

        <!-- Section 3: Results -->
        <section id="result-section" class="card hidden">
            <h2>ผลการทดสอบและผลการเรียน</h2>
            <p id="result-student-info" class="text-bold"></p>
            <div class="table-responsive">
                <table id="result-table">
                    <thead>
                        <tr>
                            <th>รายวิชา</th>
                            <th>คะแนน (10)</th>
                            <th>เกรด</th>
                        </tr>
                    </thead>
                    <tbody id="result-tbody"></tbody>
                </table>
            </div>
            <div class="gpa-box">
                <h3>เกรดเฉลี่ยสะสม (GPA)</h3>
                <h1 id="final-gpa">0.00</h1>
            </div>
            <button id="btn-restart" class="btn btn-outline">กลับหน้าหลัก</button>
        </section>
    </main>

    <!-- Firebase SDKs (Modular) -->
    <script type="module" src="app.js"></script>
</body>
</html>
